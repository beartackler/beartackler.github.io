<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0a09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Without this an iOS home-screen bookmark falls back to a
         screenshot, which for this page is a black square. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Timur Monasypov — product &amp; ai</title>
    <!--HEAD-->
    <link rel="preload" href="/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="spacer" aria-hidden="true"></div>
    <div id="hotspots" aria-hidden="true"></div>

    <p id="boot" aria-hidden="true"><span>&#9608;</span></p>
    <p id="hint" aria-hidden="true">move your cursor</p>

    <!-- The way in. Deliberately not a modal in the ARIA sense: the resume is
         in #doc at all times and a screen reader should get that, not a
         dialog about a cursor trick it cannot use. So this is hidden from the
         accessibility tree, its buttons are out of the tab order, and any
         keypress dismisses it. -->
    <div id="gate" aria-hidden="true">
      <p class="gate-lede">this is a resume. it is dark on purpose.</p>
      <p class="gate-body">your cursor is the light. move it across the page and the words develop where you look.</p>
      <p class="gate-acts">
        <button id="gate-go" type="button" tabindex="-1">begin</button>
        <button id="gate-skip" type="button" tabindex="-1">reveal it all</button>
      </p>
    </div>
    <!-- A button, not a caption. It is the only thing on the page telling you
         there is more, and something you can press is a better invitation than
         something that only says a word. Hidden from the accessibility tree
         and out of the tab order for the same reason as the gate: a screen
         reader gets #doc, which has all of it already. -->
    <button id="nudge" type="button" aria-hidden="true" tabindex="-1">
      <span class="word">scroll</span>
      <span class="fall"><i>+</i><i>=</i><i>-</i><i>:</i><i>.</i></span>
    </button>
    <span id="caret" aria-hidden="true"></span>
    <!--CODA-->
    <!--OUTRO-->

    <div class="chrome">
      <span id="pct" aria-hidden="true"></span>
      <button id="reveal-toggle" type="button">reveal</button>
      <a id="resume-link" href="/timur-monasypov-resume.pdf" target="_blank" rel="noopener">resume</a>
    </div>

    <!--DOC-->

    <noscript>
      <style>
        #field, #hotspots, #spacer, #boot, #hint, #gate, #nudge, #caret, #coda, #outro, .chrome { display: none !important; }
        #doc { position: static !important; clip-path: none !important; width: auto !important; height: auto !important; }
      </style>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
